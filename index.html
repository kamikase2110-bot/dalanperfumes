<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DALAN | Perfumería </title>
    <!-- Google Fonts & FontAwesome para iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #0f0f11;
            --bg-card: #18181c;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #f4f4f6;
            --text-muted: #a1a1aa;
            --accent-green: #25d366;
            --border-color: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        h1, h2, h3, .brand-title {
            font-family: 'Cinzel', serif;
        }

        /* Header */
        header {
            background-color: rgba(15, 15, 17, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            text-decoration: none;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #aa7c11 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
            line-height: 1;
        }

        .logo-subtitle {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .cart-btn {
            background: var(--bg-card);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .cart-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .decant-btn {
            background: linear-gradient(135deg, #25d366, #128c7e);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 0.65rem 1rem;
            border-radius: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(18, 140, 126, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .decant-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 11px 24px rgba(18, 140, 126, 0.4);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4.5rem 5% 2.5rem;
            background: linear-gradient(to bottom, #18181c, var(--bg-dark));
            border-bottom: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 2.3rem;
            color: var(--gold-light);
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 650px;
            margin: 0 auto;
            line-height: 1.5;
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 5%;
        }

        /* Filters */
        .filters {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 280px;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border-radius: 8px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: var(--gold);
        }

        .exchange-box {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
        }

        .exchange-box label {
            color: var(--text-muted);
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .exchange-box input {
            width: 100px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            padding: 0.45rem 0.6rem;
        }

        .exchange-box.rate-display {
            min-width: 220px;
            padding: 0.8rem 1.1rem;
            border-color: rgba(212, 175, 55, 0.45);
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.16), var(--bg-card));
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        .rate-display label {
            color: var(--gold-light);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .rate-display input {
            width: 92px;
            border: 0;
            color: var(--gold-light);
            font-size: 1.35rem;
            font-weight: 800;
            padding: 0;
            text-align: right;
            outline: none;
            cursor: default;
        }

        .stock-filters {
            display: flex;
            gap: 0.45rem;
            padding: 0.35rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 9px;
        }

        .stock-filter-btn {
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            padding: 0.65rem 0.8rem;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .stock-filter-btn:hover,
        .stock-filter-btn.active {
            background: var(--gold);
            color: var(--bg-dark);
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Products Grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.45rem;
            margin-top: 2rem;
        }

        .pagination button {
            min-width: 40px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text-muted);
            padding: 0.6rem 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled),
        .pagination button.active {
            border-color: var(--gold);
            background: var(--gold);
            color: var(--bg-dark);
        }

        .pagination button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(212, 175, 55, 0.4);
        }

        .product-img-container {
            position: relative;
            height: 250px;
            background: #202025;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .product-img-placeholder {
            color: #d2d2d6;
            font-size: 14px;
            padding: 16px;
            text-align: center;
        }

        .product-card:hover .product-img-container img {
            transform: scale(1.05);
        }

        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            z-index: 2;
        }

        .badge.stock {
            background: rgba(37, 211, 102, 0.15);
            color: #25d366;
            border: 1px solid rgba(37, 211, 102, 0.4);
        }

        .badge.order {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .product-validation {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.18);
            z-index: 3;
            opacity: 0.9;
        }

        .product-validation.valid {
            background: #2ecc71;
        }

        .product-validation.warning {
            background: #f39c12;
        }

        .product-validation.invalid {
            background: #e74c3c;
        }

        .product-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .product-brand {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.8rem;
        }

        .inspiration-box {
            background: rgba(212, 175, 55, 0.05);
            border-left: 2px solid var(--gold);
            padding: 6px 10px;
            font-size: 0.85rem;
            color: var(--gold-light);
            margin-bottom: 1rem;
            border-radius: 0 4px 4px 0;
        }

        .product-notes {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .product-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--gold);
        }

        .add-to-cart-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .add-to-cart-btn:hover {
            background: var(--gold);
            color: var(--bg-dark);
        }

        /* Carrito Drawer */
        .cart-drawer {
            position: fixed;
            top: 0;
            right: -400px;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease-in-out;
            box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }

        .cart-drawer.open {
            right: 0;
        }

        .cart-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .cart-body {
            padding: 1.5rem;
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-item-info h4 {
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .cart-item-info span {
            font-size: 0.85rem;
            color: var(--gold);
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-actions button {
            background: var(--border-color);
            border: none;
            color: var(--text-main);
            width: 25px;
            height: 25px;
            border-radius: 4px;
            cursor: pointer;
        }

        .cart-footer {
            padding: 1.5rem;
            border-top: 1px solid var(--border-color);
            background: var(--bg-dark);
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .discount-message {
            margin-bottom: 0.9rem;
            padding: 0.7rem 0.8rem;
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 6px;
            color: var(--gold-light);
            background: rgba(212, 175, 55, 0.08);
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .whatsapp-checkout-btn {
            width: 100%;
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }

        .whatsapp-checkout-btn:hover {
            opacity: 0.9;
        }

        .whatsapp-float {
            position: fixed;
            right: 1.25rem;
            bottom: 1.25rem;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #25d366;
            color: #fff;
            font-size: 1.85rem;
            text-decoration: none;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
            z-index: 900;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .whatsapp-float:hover {
            color: #fff;
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 11px 26px rgba(37, 211, 102, 0.35);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            z-index: 999;
            display: none;
        }

        .overlay.active {
            display: block;
        }

        .empty-cart {
            text-align: center;
            color: var(--text-muted);
            margin-top: 3rem;
        }

        @media (max-width: 620px) {
            header {
                padding: 1rem 4%;
            }

            .logo {
                font-size: 1.7rem;
            }

            .logo-subtitle {
                letter-spacing: 3px;
            }

            .header-actions {
                gap: 0.45rem;
            }

            .decant-btn,
            .cart-btn {
                padding: 0.6rem 0.7rem;
            }

            .decant-btn span {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="logo-container">
            <span class="logo">DALAN</span>
            <span class="logo-subtitle">Perfumería Exclusiva</span>
        </a>
        <div class="header-actions">
            <button class="decant-btn" onclick="solicitarDecant()" title="Solicitar decants por WhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>Solicita aquí tus decants</span>
            </button>
            <button class="cart-btn" onclick="toggleCart()">
                <i class="fa-solid fa-bag-shopping"></i>
                <span id="cart-count">0</span> ítems
            </button>
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>El Arte de la Alta Perfumería Árabe y diseñadores</h1>
        <p>Descubre frascos originales diseñados para dejar una huella inolvidable. Haz tus pedidos directos vía WhatsApp.</p>
    </section>

    <!-- Main Container -->
    <div class="container">
        <!-- Filters -->
        <div class="filters">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Busca por perfume o inspiración (Ej: Khamrah, Yara, Sublime...)" oninput="filterProducts()">
            </div>
            <div class="exchange-box rate-display">
                <label for="cotizacionDolar">Tipo de cambio</label>
                <input type="number" id="cotizacionDolar" value="0" step="0.01" readonly aria-readonly="true" tabindex="-1">
                <span>Bs / USD</span>
            </div>
            <div class="stock-filters" aria-label="Filtrar disponibilidad">
                <button class="stock-filter-btn active" data-stock-filter="all" onclick="seleccionarFiltroStock('all')">Todos</button>
                <button class="stock-filter-btn" data-stock-filter="stock" onclick="seleccionarFiltroStock('stock')">En stock</button>
                <button class="stock-filter-btn" data-stock-filter="order" onclick="seleccionarFiltroStock('order')">Por pedido</button>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="products-grid">
            <!-- Renderizado dinámico -->
        </div>
        <nav class="pagination" id="pagination" aria-label="Paginación de productos"></nav>
    </div>

    <!-- Carrito Desplegable -->
    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <a class="whatsapp-float" href="https://wa.me/59176609312?text=Hola%20LyD%2C%20necesito%20informaci%C3%B3n%20sobre%20un%20perfume." target="_blank" rel="noopener" aria-label="Contactar por WhatsApp" title="Contactar por WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
    </a>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Tu Lista de Pedido</h3>
            <button class="close-cart" onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-body" id="cart-body">
            <div class="empty-cart">Tu carrito está vacío</div>
        </div>
        <div class="cart-footer">
            <div class="discount-message">Solicita tu descuento</div>
            <div class="cart-total">
                <span>Total Estimado:</span>
                <span id="cart-total-price" style="color: var(--gold);">Bs 0</span>
            </div>
            <button class="whatsapp-checkout-btn" onclick="sendToWhatsApp()">
                <i class="fa-brands fa-whatsapp" style="font-size: 1.2rem;"></i> Enviar Pedido por WhatsApp
            </button>
        </div>
    </div>

    <script>
        // === CONFIGURACIÓN DE PRECIOS Y VARIABLES ===
        // Puedes cambiar estos valores cuando lo necesites
        const costoTransporteUSD = 5;
        const gananciaBs = 150;
        let cotizacionDolar = 0;

        function actualizarCotizacionDolar() {
            const inputCotizacion = document.getElementById('cotizacionDolar');
            const valorInput = Number(inputCotizacion?.value);
            cotizacionDolar = Number.isFinite(valorInput) && valorInput > 0 ? valorInput : 0;
            if (inputCotizacion) {
                inputCotizacion.value = cotizacionDolar > 0 ? cotizacionDolar.toFixed(2) : '0.00';
            }
            return cotizacionDolar;
        }

        async function cargarCotizacionBinance() {
            try {
                const response = await fetch('/api/binance-rate');

                if (!response.ok) {
                    throw new Error(`No se pudo obtener la cotización (${response.status})`);
                }

                const data = await response.json();
                const precio = Number(data?.price);

                if (precio && precio > 0) {
                    cotizacionDolar = precio;
                    const inputCotizacion = document.getElementById('cotizacionDolar');
                    if (inputCotizacion) {
                        inputCotizacion.value = cotizacionDolar.toFixed(2);
                    }
                    filterProducts(false);
                    return cotizacionDolar;
                }

                throw new Error(data?.error || 'La función no devolvió una cotización válida.');
            } catch (error) {
                console.warn('No se pudo obtener la cotización de Binance; se mostrarán precios para consultar.', error);
            }

            cotizacionDolar = 0;
            const inputCotizacion = document.getElementById('cotizacionDolar');
            if (inputCotizacion) inputCotizacion.value = '0.00';
            filterProducts(false);
            return cotizacionDolar;
        }

        function calcularPrecioBolivianos(precioUSD) {
            const precioUsd = Number(precioUSD) || 0;
            const tipoCambio = Number(cotizacionDolar) || 0;

            if (precioUsd <= 0 || tipoCambio <= 0) {
                return null;
            }

            return ((precioUsd + costoTransporteUSD) * tipoCambio) + gananciaBs;
        }

        function recalcularPrecios() {
            actualizarCotizacionDolar();
            perfumesDB.forEach(producto => {
                producto.precio = calcularPrecioBolivianos(producto.precioUSD);
            });
        }

        // === BASE DE DATOS AMPLIADA LyD ===
        // IMPORTANTE: Modifica el "precioUSD" de cada perfume con tu costo real en dólares
        // === BASE DE DATOS AMPLIADA LyD ===
        const perfumesDB = [
            {
                id: 1,
                referencia: "75288",
                nombre: "9 PM Rebel EDP 100ml",
                marca: "Afnan",
                tipoStock: 0,
                estadoTexto: "Por pedido",
                inspiracion: "Se parece a: Le Male Elixir de Jean Paul Gaultier",
                notas: "Manzana, bergamota, lavanda, canela, vainilla y ámbar.",
                imagen: "https://fimgs.net/photogram/p1200/q7/hg/VF8tmGPpMlWkDbyJ.jpg",
                precioUSD: 32
            },
            {
                id: 2,
                referencia: "02345",
                nombre: "9AM Blanco EDP 100ml",
                marca: "Afnan",
                tipoStock: 1,
                estadoTexto: "En stock",

            },
            {
                id: 455,

                nombre: "Desodorante LA VOIE EDP 200ML",
                marca: "Ma Al",
                tipoStock: 0,
                estadoTexto: "Por pedido",

                notas: "Notas no disponibles.",
                imagen: "Imagen no disponible",
                precioUSD: 3
            },
            {
                id: 456,
                nombre: "Desodorante SO CANDID ROUGE 200ML",
                marca: "Ma Al",
                tipoStock: 0,
                estadoTexto: "Por pedido",
                inspiracion: "Consulta disponibilidad por WhatsApp",
                notas: "Notas no disponibles.",
                imagen: "Imagen no disponible",
                precioUSD: 3
            },
            {
                id: 457,
                nombre: "MUSAMAM EDP 100ML (Alternativo)",
                marca: "Lattafa",
                tipoStock: 0,
                estadoTexto: "Por pedido",
                inspiracion: "Consulta disponibilidad por WhatsApp",
                notas: "Notas no disponibles.",
                imagen: "Imagen no disponible",
                precioUSD: 21
            }
        ];

        function normalizarDisponibilidad(producto) {
            const valorNumerico = producto.tipoStock;
            const esValorNumerico = valorNumerico === 1 || valorNumerico === 0 || valorNumerico === '1' || valorNumerico === '0';
            const enStock = esValorNumerico
                ? Number(valorNumerico) === 1
                : !/por pedido/i.test(producto.estadoTexto || '');

            producto.tipoStock = enStock ? 1 : 0;
            producto.estadoTexto = enStock ? 'En stock' : 'Por pedido';
        }

        perfumesDB.forEach(normalizarDisponibilidad);

        const marcasAbreviadas = {
            "AL WA": "Al Wataniah",
            "PC": "Paris Corner",
            "FA": "French Avenue",
            "JEAN P.": "Jean Paul Gaultier",
            "MA AL": "Maison Alhambra",
            "VS": "Victoria's Secret",
            "RASASI": "Rassasi",
            "RASSASI": "Rassasi",
            "RAYHAAN": "Rayhaan"
        };

        perfumesDB.forEach(producto => {
            const nombreMayusculas = producto.nombre.toLocaleUpperCase();
            const prefijo = Object.keys(marcasAbreviadas).find(sigla => nombreMayusculas.startsWith(`${sigla} `));

            if (prefijo) {
                producto.marca = marcasAbreviadas[prefijo];
                producto.nombre = producto.nombre.slice(prefijo.length).trim();
            } else {
                const marcaActual = producto.marca.trim().toLocaleUpperCase();
                const marcaAbreviada = Object.keys(marcasAbreviadas).find(sigla => marcaActual === sigla);
                if (marcaAbreviada) producto.marca = marcasAbreviadas[marcaAbreviada];
                else if (marcaActual === 'LYD' || marcaActual === 'DALAN') producto.marca = '';
            }
        });

        // === APLICAR LA FÓRMULA AUTOMÁTICAMENTE ===
        // Formula: ((Precio USD + Transporte) * Cotización Dolar) + Ganancia en Bs
        recalcularPrecios();

        let cart = [];
        let filtroStockActual = 'all';
        let paginaActual = 1;
        const productosPorPagina = 24;

        function obtenerEstadoValidacion(product) {
            const precioUSD = Number(product?.precioUSD);
            const precioBs = Number(product?.precio);

            if (!Number.isFinite(precioUSD) || precioUSD <= 0) {
                return { clase: 'invalid', titulo: 'Revisar precio: valor no válido' };
            }

            if (!Number.isFinite(precioBs) || precioBs <= 0) {
                return { clase: 'warning', titulo: 'Revisar precio: falta validación final' };
            }

            return { clase: 'valid', titulo: 'Precio validado' };
        }

        function requiereConsultaPrecio(producto) {
            const nombre = producto.nombre.toLocaleLowerCase();
            return producto.precio === null || nombre.startsWith('desodorante ') || nombre.startsWith('mini ');
        }

        function renderProducts(productsToRender) {
            const grid = document.getElementById('products-grid');
            const pagination = document.getElementById('pagination');
            const totalPaginas = Math.ceil(productsToRender.length / productosPorPagina);
            paginaActual = totalPaginas === 0 ? 1 : Math.min(paginaActual, totalPaginas);
            const inicio = (paginaActual - 1) * productosPorPagina;
            const productosDePagina = productsToRender.slice(inicio, inicio + productosPorPagina);
            grid.innerHTML = '';

            if(productsToRender.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">No se encontraron perfumes.</p>';
                pagination.innerHTML = '';
                return;
            }

            productosDePagina.forEach(p => {
                const badgeClass = /por pedido/i.test(p.estadoTexto) ? 'order' : 'stock';
                const estadoValidacion = obtenerEstadoValidacion(p);

                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-container">
                            <span class="badge ${badgeClass}">${p.estadoTexto}</span>
                            <span class="product-validation ${estadoValidacion.clase}" title="${estadoValidacion.titulo}" aria-label="${estadoValidacion.titulo}"></span>
                            ${p.imagen === 'Imagen no disponible'
                                ? '<span class="product-img-placeholder">Imagen no disponible</span>'
                                : `<img src="${p.imagen}" alt="${p.nombre}">`}
                        </div>
                        <div class="product-info">
                            ${p.marca ? `<span class="product-brand">${p.marca}</span>` : ''}
                            <h3 class="product-title">${p.nombre}</h3>
                            <div class="inspiration-box"><i class="fa-solid fa-wand-magic-sparkles"></i> ${p.inspiracion}</div>
                            <p class="product-notes"><strong>Notas:</strong> ${p.notas}</p>

                            <div class="product-footer">
                                ${requiereConsultaPrecio(p)
                                    ? `<button class="add-to-cart-btn" onclick="consultarPrecioProducto(${p.id})" title="Consultar por WhatsApp"><i class="fa-brands fa-whatsapp" aria-hidden="true"></i> Consultar precio</button>`
                                    : `<span class="product-price">Bs ${Math.round(p.precio)}</span><button class="add-to-cart-btn" onclick="addToCart(${p.id})">Agregar</button>`}
                            </div>
                        </div>
                    </div>
                `;
            });

            renderPagination(totalPaginas);
        }

        function renderPagination(totalPaginas) {
            const pagination = document.getElementById('pagination');
            if (totalPaginas <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let botones = `
                <button onclick="irAPagina(${paginaActual - 1})" ${paginaActual === 1 ? 'disabled' : ''}>Anterior</button>
            `;

            for (let pagina = 1; pagina <= totalPaginas; pagina++) {
                botones += `<button class="${pagina === paginaActual ? 'active' : ''}" onclick="irAPagina(${pagina})">${pagina}</button>`;
            }

            botones += `
                <button onclick="irAPagina(${paginaActual + 1})" ${paginaActual === totalPaginas ? 'disabled' : ''}>Siguiente</button>
            `;
            pagination.innerHTML = botones;
        }

        function irAPagina(pagina) {
            paginaActual = pagina;
            filterProducts(false);
            document.getElementById('products-grid').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function filterProducts(resetPage = true) {
            recalcularPrecios();
            if (resetPage) paginaActual = 1;
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = perfumesDB.filter(p => 
                (filtroStockActual === 'all' ||
                    (filtroStockActual === 'order' && /por pedido/i.test(p.estadoTexto)) ||
                    (filtroStockActual === 'stock' && !/por pedido/i.test(p.estadoTexto))) &&
                (p.nombre.toLowerCase().includes(query) ||
                (p.marca || '').toLowerCase().includes(query) ||
                p.inspiracion.toLowerCase().includes(query))
            );
            renderProducts(filtered);
        }

        function seleccionarFiltroStock(filtro) {
            filtroStockActual = filtro;
            document.querySelectorAll('.stock-filter-btn').forEach(boton => {
                boton.classList.toggle('active', boton.dataset.stockFilter === filtro);
            });
            filterProducts();
        }

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('active');
        }

        function addToCart(id) {
            const product = perfumesDB.find(p => p.id === id);
            if (!product || requiereConsultaPrecio(product)) return;
            const existing = cart.find(item => item.id === id);

            if(existing) {
                existing.quantity++;
            } else {
                cart.push({
                    id: product.id,
                    nombre: product.nombre,
                    marca: product.marca,
                    precio: product.precio,
                    estadoTexto: product.estadoTexto,
                    quantity: 1
                });
            }
            updateCartUI();
            toggleCart();
        }

        function consultarPrecioProducto(id) {
            const product = perfumesDB.find(p => p.id === id);
            if (!product) return;

            const phoneNumber = '59176609312';
            const nombreProducto = product.marca ? `${product.marca} - ${product.nombre}` : product.nombre;
            const message = `Hola, quisiera consultar el precio y disponibilidad de ${nombreProducto}.`;
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank', 'noopener');
        }

        function changeQuantity(id, change) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.quantity += change;
                if(item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartBody = document.getElementById('cart-body');
            const cartCount = document.getElementById('cart-count');
            const cartTotalPrice = document.getElementById('cart-total-price');

            let totalItems = 0;
            let totalPrice = 0;

            if(cart.length === 0) {
                cartBody.innerHTML = '<div class="empty-cart">Tu carrito está vacío</div>';
            } else {
                cartBody.innerHTML = '';
                cart.forEach(item => {
                    totalItems += item.quantity;
                    totalPrice += item.precio * item.quantity;
                    const nombreProducto = item.marca ? `${item.marca} - ${item.nombre}` : item.nombre;
                    cartBody.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-info">
                                <h4>${nombreProducto}</h4>
                                <span>Bs ${Math.round(item.precio)} x ${item.quantity}</span>
                            </div>
                            <div class="cart-item-actions">
                                <button onclick="changeQuantity(${item.id}, -1)">-</button>
                                <span>${item.quantity}</span>
                                <button onclick="changeQuantity(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            cartCount.innerText = totalItems;
            cartTotalPrice.innerText = `Bs ${Math.round(totalPrice)}`;
        }

        function sendToWhatsApp() {
            if(cart.length === 0) return;

            const phoneNumber = "59176609312"; // Número de WhatsApp configurado

            let message = "¡Hola DALAN! me gustaría hacer el siguiente pedido:\n\n";
            let total = 0;

            cart.forEach(item => {
                let subtotal = item.precio * item.quantity;
                total += subtotal;
                const estadoPedido = /por pedido/i.test(item.estadoTexto) ? ' [Por pedido]' : '';
                const nombreProducto = item.marca ? `${item.marca} - ${item.nombre}` : item.nombre;
                message += `• *${item.quantity}x* ${nombreProducto} - Bs ${Math.round(item.precio)} c/u${estadoPedido}\n`;
            });

            message += `\n*Total Estimado: Bs ${Math.round(total)}*\n\nPor favor, indíquenme los datos para realizar el pago. ¡Gracias!`;

            const encodedMessage = encodeURIComponent(message);
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            let whatsappUrl = isMobile 
                ? `https://api.whatsapp.com/send?phone=${phoneNumber}&text=${encodedMessage}`
                : `whatsapp://send?phone=${phoneNumber}&text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        function solicitarDecant() {
            const perfume = window.prompt('¿De qué perfume deseas solicitar el decants?');
            if (!perfume || !perfume.trim()) return;

            const phoneNumber = '59176609312';
            const message = `Hola Perfumeria DALAN, quisiera saber si tiene disponibles los decants del perfume ${perfume.trim()}.`;
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodedMessage}`;

            window.open(whatsappUrl, '_blank');
        }

        renderProducts(perfumesDB);

        cargarCotizacionBinance()
            .catch(error => console.warn('No se pudo actualizar la cotización de Binance.', error));



         
    </script>
